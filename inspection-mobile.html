<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>试产检验</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d38;--text:#e8e9ed;--muted:#777;--ok:#2ecc71;--ng:#e74c3c;--blue:#4a90d9;--red:#d9485e;--r:8px;--t:.2s ease}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
.page{display:none;flex-direction:column;height:100%;overflow-y:auto}
.page.on{display:flex}

/* ── Step 1: 选择车型 ── */
.step1{align-items:center;justify-content:center;padding:20px;gap:24px}
.step1 h1{font-size:20px;font-weight:800;text-align:center}
.step1 .sub{font-size:13px;color:var(--muted);text-align:center}
.vlist{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.vcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:12px}
.vcard:active{background:#222;transform:scale(.98)}
.vcard .vicon{font-size:28px}
.vcard .vinfo{flex:1}
.vcard .vname{font-size:16px;font-weight:700}
.vcard .vdesc{font-size:12px;color:var(--muted);margin-top:2px}

/* ── Step 2: 选择岗位 ── */
.step2{padding:16px;gap:12px}
.step2 .back{font-size:13px;color:var(--muted);cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px}
.step2 h2{font-size:18px;font-weight:700}
.step2 .vlabel{font-size:12px;color:var(--blue);background:rgba(74,144,217,.1);padding:2px 8px;border-radius:4px;align-self:flex-start}
.slist{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:var(--t)}
.scard:active{background:#222;transform:scale(.98)}
.scard .sname{font-size:16px;font-weight:700}
.scard .smeta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px}
.scard .sskills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.scard .sskill{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}

/* ── Step 3: 检验 ── */
.step3{padding:0}
.step3 .topbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5}
.step3 .topbar .back2{font-size:18px;color:var(--muted);cursor:pointer;padding:4px;flex-shrink:0}
.step3 .topbar .info{flex:1;min-width:0}
.step3 .topbar .tname{font-size:14px;font-weight:700}
.step3 .topbar .tmeta{font-size:11px;color:var(--muted)}
.step3 .vinbar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);align-items:center}
.step3 .vinbar input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;color:var(--text);font-size:14px;outline:none}
.step3 .vinbar input:focus{border-color:var(--blue)}
.step3 .vinbar .vinsubmit{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer}
.step3 .items{flex:1;overflow-y:auto;padding:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);border-radius:var(--r);transition:var(--t);margin-bottom:2px}
.item:active{background:rgba(255,255,255,.03)}
.item.ng{background:rgba(231,76,60,.06)}
.item .it-info{flex:1;min-width:0}
.item .it-name{font-size:13px;font-weight:500}
.item .it-meta{font-size:10px;color:var(--muted);margin-top:2px}

/* Big OK/NG buttons */
.item .it-actions{display:flex;gap:6px;flex-shrink:0}
.btn-ok{width:52px;height:36px;border-radius:8px;border:2px solid #2a2d38;background:transparent;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;transition:var(--t)}
.btn-ok.on{background:rgba(46,204,113,.15);border-color:var(--ok);color:var(--ok)}
.btn-ng{width:52px;height:36px;border-radius:8px;border:2px solid #2a2d38;background:transparent;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;transition:var(--t)}
.btn-ng.on{background:rgba(231,76,60,.15);border-color:var(--ng);color:var(--ng)}

/* NG detail area */
.item .ng-detail{display:none;flex-wrap:wrap;gap:6px;padding:6px 0;align-items:center}
.item.ng .ng-detail{display:flex}
.ng-detail select{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;max-width:140px}
.btn-photo{display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:8px;border:1px dashed var(--border);background:var(--card);color:var(--muted);font-size:12px;cursor:pointer;transition:var(--t)}
.btn-photo:active{background:#222}
.btn-photo.has{background:rgba(46,204,113,.1);border-color:var(--ok);color:var(--ok)}
.photo-preview{display:flex;gap:4px;flex-wrap:wrap}
.photo-preview img{width:48px;height:48px;border-radius:6px;object-fit:cover;border:1px solid var(--border)}

/* Bottom bar */
.bottombar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--card);position:sticky;bottom:0}
.bottombar .btn-all-ok{flex:1;padding:12px;border-radius:8px;border:2px solid var(--ok);background:rgba(46,204,113,.1);color:var(--ok);font-size:14px;font-weight:800;cursor:pointer}
.bottombar .btn-all-ok:active{background:var(--ok);color:#fff}
.bottombar .btn-submit{flex:1;padding:12px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.bottombar .btn-submit:active{opacity:.8}
.bottombar .sum{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:13px;font-weight:700}
.bottombar .sum .ok-n{color:var(--ok)}.bottombar .sum .ng-n{color:var(--ng)}

/* Photo viewer */
.pv{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.pv.off{display:none}
.pv img{max-width:95vw;max-height:95vh;border-radius:8px}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}

/* Step 4: 完成 */
.step4{align-items:center;justify-content:center;padding:20px;gap:16px;text-align:center}
.step4 .done-icon{font-size:64px}
.step4 h2{font-size:20px;font-weight:800}
.step4 .done-info{font-size:13px;color:var(--muted);line-height:1.6}
.step4 .btn-row{display:flex;gap:10px;margin-top:8px}
.step4 .btn-next{padding:12px 24px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer}
.step4 .btn-export{padding:12px 24px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--border);font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- ── Step 1: 选择车型 ── -->
<div class="page on" id="step1">
  <h1>🏍 试产检验</h1>
  <p class="sub">选择检验车型</p>
  <div class="vlist" id="vehicleList"></div>
</div>

<!-- ── Step 2: 选择岗位 ── -->
<div class="page" id="step2">
  <div class="back" onclick="goStep(1)">← 返回选择车型</div>
  <span class="vlabel" id="step2Vehicle"></span>
  <h2>选择检验岗位</h2>
  <div class="slist" id="stationList"></div>
</div>

<!-- ── Step 3: 检验 ── -->
<div class="page" id="step3">
  <div class="topbar">
    <div class="back2" onclick="goStep(2)">←</div>
    <div class="info">
      <div class="tname" id="step3Station"></div>
      <div class="tmeta" id="step3Meta"></div>
    </div>
  </div>
  <div class="vinbar">
    <input type="text" id="inspectorInput" placeholder="检验员姓名" style="width:100px;flex:none" onchange="onInsChange()">
    <input type="text" id="vinInput" placeholder="输入车架号..." onchange="onVinChange()">
    <button class="vinsubmit" onclick="confirmVin()">确认</button>
  </div>
  <div class="items" id="itemsList"></div>
  <div class="bottombar">
    <div class="sum"><span class="ok-n" id="okCount">0</span>OK / <span class="ng-n" id="ngCount">0</span>NG</div>
    <button class="btn-all-ok" onclick="allOK()">全部OK</button>
    <button class="btn-submit" onclick="submitInspection()">提交</button>
  </div>
</div>

<!-- ── Step 4: 完成 ── -->
<div class="page" id="step4">
  <div class="done-icon">✅</div>
  <h2>提交成功</h2>
  <div class="done-info" id="doneInfo"></div>
  <div class="btn-row">
    <button class="btn-next" onclick="goStep(2)">下一台车</button>
    <button class="btn-export" onclick="exportAll()">📥 导出全部</button>
  </div>
</div>

<!-- Photo viewer -->
<div class="pv off" id="pv" onclick="this.classList.add('off')"><img id="pvImg" src=""></div>

<!-- Photo editor -->
<div id="photoEditor" style="position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column">
  <div style="padding:10px;display:flex;align-items:center;justify-content:space-between;background:#111">
    <span style="font-size:14px;font-weight:700;color:#fff">📷 照片标注</span>
    <div style="display:flex;gap:6px">
      <button onclick="cancelEditPhoto()" style="padding:6px 12px;border:none;border-radius:6px;background:#333;color:#ccc;font-size:12px;cursor:pointer">取消</button>
      <button onclick="saveEditPhoto()" style="padding:6px 12px;border:none;border-radius:6px;background:#4a90d9;color:#fff;font-size:12px;font-weight:700;cursor:pointer">保存</button>
    </div>
  </div>
  <div style="flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center" id="canvasContainer">
    <canvas id="editCanvas" style="max-width:100%;max-height:100%;touch-action:none"></canvas>
  </div>
  <div style="padding:10px;background:#111;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
    <button onclick="setTool('draw')" id="tool-draw" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">✏️ 画笔</button>
    <button onclick="setTool('circle')" id="tool-circle" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">⭕ 圆圈</button>
    <button onclick="setTool('arrow')" id="tool-arrow" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">➤ 箭头</button>
    <button onclick="setTool('text')" id="tool-text" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">📝 文字</button>
    <button onclick="undoEdit()" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">↶ 撤销</button>
    <button onclick="clearEdit()" style="padding:8px 14px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;font-size:12px;cursor:pointer">🗑 清除</button>
  </div>
  <div style="padding:6px 10px;background:#111;display:flex;gap:8px;justify-content:center">
    <button onclick="setColor('#e74c3c')" id="color-red" style="width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#e74c3c;cursor:pointer"></button>
    <button onclick="setColor('#f1c40f')" id="color-yellow" style="width:28px;height:28px;border-radius:50%;border:2px solid #444;background:#f1c40f;cursor:pointer"></button>
    <button onclick="setColor('#fff')" id="color-white" style="width:28px;height:28px;border-radius:50%;border:2px solid #444;background:#fff;cursor:pointer"></button>
    <button onclick="setColor('#2ecc71')" id="color-green" style="width:28px;height:28px;border-radius:50%;border:2px solid #444;background:#2ecc71;cursor:pointer"></button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

// ═══════════════ PAGE NAVIGATION ═══════════════
function goStep(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('step'+n).classList.add('on');
  if(n===1)renderVehicles();
  else if(n===2)renderStations();
  else if(n===3)renderItems();
}

function renderVehicles(){
  var list=document.getElementById('vehicleList');
  list.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">⏳ 正在加载车型...</div>';
  // Fetch ALL vehicle configs from server (synced from PC)
  fetch(API_BASE+'/api/configs').then(function(r){return r.json();}).then(function(configs){
    var names=Object.keys(configs||{});
    if(names.length===0){
      list.innerHTML='<div style="text-align:center;padding:30px 20px;color:var(--muted);font-size:13px;line-height:1.6">📋 暂无车型配置<br><br>请先在 PC 端「岗位配置」中<br>保存车型岗位配置</div>';
      return;
    }
    list.innerHTML=names.map(function(name){
      var cfg=configs[name];
      var stCount=cfg.stations?cfg.stations.length:0;
      var totalItems=0;
      if(cfg.stations){cfg.stations.forEach(function(s){totalItems+=(s.items||[]).length;});}
      return '<div class="vcard" onclick="selectSavedVehicle(\''+name+'\')"><div class="vicon">📋</div><div class="vinfo"><div class="vname">'+name+'</div><div class="vdesc">'+stCount+'个岗位 · '+totalItems+'项检验</div></div></div>';
    }).join('');
  }).catch(function(e){
    list.innerHTML='<div style="text-align:center;padding:30px 20px;color:var(--muted);font-size:13px;line-height:1.6">⚠️ 无法连接服务器<br><br>请确认：<br>1. PC 端服务器已启动<br>2. 手机和电脑在同一 WiFi<br>3. 网址正确</div>';
  });
}

function selectSavedVehicle(name){
  curVehicle=name;
  // Load station config from server
  fetch(API_BASE+'/api/configs').then(r=>r.json()).then(configs=>{
    if(configs[name]){
      stations=configs[name].stations||[];
      stCnt=configs[name].stCnt||stations.length;
      document.getElementById('step2Vehicle').textContent='车型：'+name;
      goStep(2);
    }else{
      showToast('⚠️ 未找到配置');
    }
  }).catch(e=>{showToast('⚠️ 无法加载配置');});
}

function selectVehicle(id,name){
  curVehicle=id;
  document.getElementById('step2Vehicle').textContent='车型：'+name;
  goStep(2);
}

function renderStations(){
  document.getElementById('stationList').innerHTML=stations.filter(s=>s.items.length>0).map(st=>{
    var si=st.items.map(id=>gItem(id)).filter(Boolean);
    var sh=st.skills.map(s=>{var co=SCOLS[s]||{bg:'rgba(255,255,255,.1)',fg:'#ccc'};return'<span class="sskill" style="background:'+co.bg+';color:'+co.fg+'">'+s+'</span>';}).join('');
    return'<div class="scard" onclick="selectStation(\''+st.id+'\',\''+st.name+'\',\''+si.length+'\')"><div class="sname">'+st.name+'</div><div class="smeta"><span>📦 '+si.length+'项</span></div><div class="sskills">'+sh+'</div></div>';
  }).join('');
}

function selectStation(id,name,count){
  curStationId=id;
  curVin='';
  curResults={};
  var st=stations.find(s=>s.id===id);
  if(st){
    st.items.forEach(iid=>{curResults[iid]={r:null,dt:'',ps:[]};});
  }
  document.getElementById('step3Station').textContent=name;
  document.getElementById('step3Meta').textContent=count+'项检验';
  document.getElementById('vinInput').value='';
  goStep(3);
}

// ═══════════════ INSPECTION ═══════════════
function renderItems(){
  var st=stations.find(s=>s.id===curStationId);
  if(!st)return;
  var items=st.items.map(id=>gItem(id)).filter(Boolean);
  var c=document.getElementById('itemsList');
  c.innerHTML=items.map(function(it){
    var r=curResults[it.id]||{r:null,dt:'',ps:[]};
    var isOK=r.r==='ok',isNG=r.r==='ng',hp=r.ps&&r.ps.length>0;
    var criteria=CRITERIA[it.sn]||'';
    var criteriaHtml=criteria?'<div style="font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4;padding:4px 6px;background:rgba(255,255,255,.03);border-radius:4px;white-space:pre-line">'+criteria+'</div>':'';
    return'<div class="item'+(isNG?' ng':'')+'" id="it-'+it.id+'"><div class="it-info"><div class="it-name">'+it.n+'</div><div class="it-meta">'+it.cn+' · 📍'+it.loc+'</div>'+criteriaHtml+(isNG?'<div class="ng-detail"><select onchange="uDt(\''+it.id+'\',this.value)"><option value="">缺陷类型</option>'+DEFECTS.map(function(d){return'<option value="'+d+'"'+(r.dt===d?' selected':'')+'>'+d+'</option>';}).join('')+'</select><button class="btn-photo'+(hp?' has':'')+'" onclick="takePhoto(\''+it.id+'\')">📷'+(hp?' ('+r.ps.length+')':'拍照')+'</button><div class="photo-preview">'+(r.ps||[]).map(function(p,i){return'<img src="'+p+'" onclick="viewPhoto(\''+p+'\')">';}).join('')+'</div></div>':'')+'</div><div class="it-actions"><button class="btn-ok'+(isOK?' on':'')+'" onclick="markOK(\''+it.id+'\')">OK</button><button class="btn-ng'+(isNG?' on':'')+'" onclick="markNG(\''+it.id+'\')">NG</button></div></div>';
  }).join('');
  updateCounts();
}

function markOK(id){
  curResults[id]={r:'ok',dt:'',ps:curResults[id]?curResults[id].ps||[]:[]};
  renderItems();
}
function markNG(id){
  curResults[id]={r:'ng',dt:curResults[id]?curResults[id].dt||DEFECTS[0]:DEFECTS[0],ps:curResults[id]?curResults[id].ps||[]:[]};
  renderItems();
}
function uDt(id,v){if(curResults[id])curResults[id].dt=v;}
function allOK(){
  var st=stations.find(s=>s.id===curStationId);
  if(!st)return;
  st.items.forEach(iid=>{
    curResults[iid]={r:'ok',dt:'',ps:curResults[iid]?curResults[iid].ps||[]:[]};
  });
  renderItems();
  showToast('✅ 全部OK');
}
function updateCounts(){
  var ok=0,ng=0;
  Object.values(curResults).forEach(r=>{if(r.r==='ok')ok++;else if(r.r==='ng')ng++;});
  document.getElementById('okCount').textContent=ok;
  document.getElementById('ngCount').textContent=ng;
}

// ═══════════════ PHOTO ═══════════════
// ═══════════ PHOTO + EDITOR ═══════════
var editCtx=null,editCanvas=null,origImg=null,curTool='draw',curColor='#e74c3c',drawStart=null,historyStack=[],editItemId=null;

function takePhoto(itemId){
  editItemId=itemId;
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      origImg=new Image();
      origImg.onload=function(){
        openPhotoEditor();
      };
      origImg.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}

function openPhotoEditor(){
  var editor=document.getElementById('photoEditor');
  editor.style.display='flex';
  editCanvas=document.getElementById('editCanvas');
  editCtx=editCanvas.getContext('2d');
  // Size canvas to image (max 1200px)
  var maxW=1200,maxH=1600;
  var w=origImg.width,h=origImg.height;
  if(w>maxW){h=h*(maxW/w);w=maxW;}
  if(h>maxH){w=w*(maxH/h);h=maxH;}
  editCanvas.width=w;editCanvas.height=h;
  editCtx.drawImage(origImg,0,0,w,h);
  historyStack=[];
  saveHistory();
  // Set default tool
  setTool('draw');
  setColor('#e74c3c');
  // Touch events
  editCanvas.ontouchstart=onCanvasStart;
  editCanvas.ontouchmove=onCanvasMove;
  editCanvas.ontouchend=onCanvasEnd;
  editCanvas.onmousedown=onCanvasStart;
  editCanvas.onmousemove=onCanvasMove;
  editCanvas.onmouseup=onCanvasEnd;
  editCanvas.onmouseleave=onCanvasEnd;
}

function getCanvasPos(e){
  var rect=editCanvas.getBoundingClientRect();
  var scaleX=editCanvas.width/rect.width;
  var scaleY=editCanvas.height/rect.height;
  var x,y;
  if(e.touches&&e.touches[0]){x=e.touches[0].clientX-rect.left;y=e.touches[0].clientY-rect.top;}
  else if(e.changedTouches&&e.changedTouches[0]){x=e.changedTouches[0].clientX-rect.left;y=e.changedTouches[0].clientY-rect.top;}
  else{x=e.clientX-rect.left;y=e.clientY-rect.top;}
  return{x:x*scaleX,y:y*scaleY};
}

function onCanvasStart(e){
  e.preventDefault();
  var p=getCanvasPos(e);drawStart=p;
  if(curTool==='text'){
    var text=prompt('输入标注文字：');
    if(text){
      editCtx.fillStyle=curColor;
      editCtx.font='bold '+(editCanvas.width>600?24:16)+'px sans-serif';
      editCtx.fillText(text,p.x,p.y);
      saveHistory();
    }
    drawStart=null;
  }else if(curTool==='draw'){
    editCtx.beginPath();editCtx.moveTo(p.x,p.y);
  }
}

function onCanvasMove(e){
  if(!drawStart)return;
  e.preventDefault();
  var p=getCanvasPos(e);
  if(curTool==='draw'){
    editCtx.strokeStyle=curColor;
    editCtx.lineWidth=editCanvas.width>600?4:3;
    editCtx.lineCap='round';
    editCtx.lineTo(p.x,p.y);editCtx.stroke();
  }else if(curTool==='circle'||curTool==='arrow'){
    // Preview: restore from history then draw shape
    restoreHistory();
    editCtx.strokeStyle=curColor;
    editCtx.lineWidth=editCanvas.width>600?4:3;
    if(curTool==='circle'){
      var dx=p.x-drawStart.x,dy=p.y-drawStart.y;
      var r=Math.sqrt(dx*dx+dy*dy);
      editCtx.beginPath();editCtx.arc(drawStart.x,drawStart.y,r,0,2*Math.PI);editCtx.stroke();
    }else if(curTool==='arrow'){
      drawArrow(drawStart.x,drawStart.y,p.x,p.y);
    }
  }
}

function onCanvasEnd(e){
  if(!drawStart)return;
  e.preventDefault();
  var p=getCanvasPos(e);
  if(curTool==='draw'){
    editCtx.lineTo(p.x,p.y);editCtx.stroke();editCtx.beginPath();
  }
  saveHistory();
  drawStart=null;
}

function drawArrow(x1,y1,x2,y2){
  var headLen=editCanvas.width>600?20:12;
  var angle=Math.atan2(y2-y1,x2-x1);
  editCtx.beginPath();editCtx.moveTo(x1,y1);editCtx.lineTo(x2,y2);editCtx.stroke();
  editCtx.beginPath();editCtx.moveTo(x2,y2);
  editCtx.lineTo(x2-headLen*Math.cos(angle-Math.PI/6),y2-headLen*Math.sin(angle-Math.PI/6));
  editCtx.moveTo(x2,y2);
  editCtx.lineTo(x2-headLen*Math.cos(angle+Math.PI/6),y2-headLen*Math.sin(angle+Math.PI/6));
  editCtx.stroke();
}

function saveHistory(){try{historyStack.push(editCanvas.toDataURL('image/jpeg',0.8));if(historyStack.length>20)historyStack.shift();}catch(e){}}
function restoreHistory(){if(historyStack.length>0){var img=new Image();img.onload=function(){editCtx.clearRect(0,0,editCanvas.width,editCanvas.height);editCtx.drawImage(img,0,0);};img.src=historyStack[historyStack.length-1];}}
function undoEdit(){if(historyStack.length>1){historyStack.pop();restoreHistory();}else if(historyStack.length===1){restoreHistory();}}
function clearEdit(){editCtx.drawImage(origImg,0,0,editCanvas.width,editCanvas.height);historyStack=[];saveHistory();}
function setTool(t){curTool=t;['draw','circle','arrow','text'].forEach(function(id){var el=document.getElementById('tool-'+id);if(el)el.style.borderColor=id===t?'#4a90d9':'#444';el.style.background=id===t?'#1a3a5a':'#222';});}
function setColor(c){
  curColor=c;
  var map={'#e74c3c':'red','#f1c40f':'yellow','#ffffff':'white','#2ecc71':'green'};
  var colorMap={'red':'#e74c3c','yellow':'#f1c40f','white':'#ffffff','green':'#2ecc71'};
  Object.keys(colorMap).forEach(function(name){
    var el=document.getElementById('color-'+name);
    if(el)el.style.border='2px solid '+(colorMap[name]===c?'#fff':'#444');
  });
}
function cancelEditPhoto(){document.getElementById('photoEditor').style.display='none';}
function saveEditPhoto(){
  var dataUrl=editCanvas.toDataURL('image/jpeg',0.7);
  if(!curResults[editItemId])curResults[editItemId]={r:null,dt:'',ps:[]};
  curResults[editItemId].ps.push(dataUrl);
  if(!curResults[editItemId].r||curResults[editItemId].r==='ok'){curResults[editItemId].r='ng';if(!curResults[editItemId].dt)curResults[editItemId].dt=DEFECTS[0];}
  document.getElementById('photoEditor').style.display='none';
  renderItems();showToast('📷 已保存标注照片');
}
function viewPhoto(src){document.getElementById('pv').classList.remove('off');document.getElementById('pvImg').src=src;}

// ═══════════════ SUBMIT ═══════════════
function onVinChange(){curVin=document.getElementById('vinInput').value.trim();}
function onInsChange(){curInspector=document.getElementById('inspectorInput').value.trim();}
function confirmVin(){curVin=document.getElementById('vinInput').value.trim();curInspector=document.getElementById('inspectorInput').value.trim();showToast('车架号：'+curVin);}

function submitInspection(){
  if(!curVin){showToast('⚠️ 请输入车架号');return;}
  var st=stations.find(s=>s.id===curStationId);
  var unchecked=st?st.items.filter(iid=>!curResults[iid]||!curResults[iid].r).length:0;
  if(unchecked>0){showToast('⚠️ 还有'+unchecked+'项未判定');return;}

  var rec={vin:curVin,inspector:curInspector,stationId:curStationId,stationName:st?st.name:'',vehicle:curVehicle,results:JSON.parse(JSON.stringify(curResults)),ts:new Date().toISOString()};
  allRecords.push(rec);
  saveRecords();

  // Sync to local server API (same origin)
  fetch(API_BASE+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)})
    .then(function(r){return r.json();})
    .then(function(d){
      var el=document.getElementById('syncMsg');
      if(el)el.innerHTML='✅ 已同步到服务器（共'+(d.total||allRecords.length)+'条）';
      showToast('☁️ 已同步');
    })
    .catch(function(e){
      var el=document.getElementById('syncMsg');
      if(el)el.innerHTML='⚠️ 同步失败，数据已存本地';
      console.error('Sync error:',e);
    });

  var ok=0,ng=0;
  Object.values(curResults).forEach(r=>{if(r.r==='ok')ok++;else if(r.r==='ng')ng++;});

  document.getElementById('doneInfo').innerHTML='车架号：<b>'+curVin+'</b><br>岗位：<b>'+(st?st.name:'')+'</b><br>OK：<b style="color:#2ecc71">'+ok+'</b> 项<br>NG：<b style="color:#e74c3c">'+ng+'</b> 项<br>已保存至本地，共 <b>'+allRecords.length+'</b> 台记录<br><br><span style="color:#3db8b0" id="syncMsg">⏳ 正在同步到服务器...</span>';
  goStep(4);
}

function exportAll(){
  var d={records:allRecords,stations:stations,exportTime:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='检验数据_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showToast('📥 已导出');
}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1800);}

// Init
renderVehicles();
</script>
