<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新品检验组试产检验看板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --bg-deep: #0e0f14; --bg-panel: #16171d; --bg-card: #1c1d26; --bg-elevated: #23242f;
  --bg-hover: #2a2b38; --border: #2d2e3a; --border-active: #4a4b5a;
  --text-primary: #e8e9ed; --text-secondary: #9899a5; --text-muted: #6b6c78;
  --accent-blue: #4a90d9; --accent-cyan: #3db8b0; --accent-green: #4caf7d;
  --accent-yellow: #e5a83e; --accent-orange: #e07b40; --accent-red: #d9485e; --accent-purple: #8b6fc0;
  --ok-color: #2ecc71; --ng-color: #e74c3c;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);display:flex;}

/* ── LEFT NAV ── */
#nav{width:180px;min-width:180px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;}
#nav .nb{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
#nav .nb .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;}
#nav .nb .bt{font-size:13px;font-weight:700;}
#nav .ni{flex:1;padding:8px 6px;display:flex;flex-direction:column;gap:3px;}
.nav-btn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-md);cursor:pointer;transition:all var(--transition);border:1px solid transparent;font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:600;color:var(--text-secondary);background:none;text-align:left;position:relative;width:100%;}
.nav-btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border);}
.nav-btn.active{background:var(--bg-elevated);color:var(--accent-blue);border-color:var(--border-active);}
.nav-btn .ni-icon{font-size:20px;}
.nav-btn .badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--accent-red);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;font-family:'JetBrains Mono',monospace;display:none;}
#nav .nf{padding:10px 10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;}
#nav .nf select{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;color:var(--text-primary);font-size:11px;font-weight:600;font-family:'Noto Sans SC',sans-serif;outline:none;cursor:pointer;}

/* ── MAIN ── */
#main{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;}
.page{width:100%;flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0;}
.page.on{display:flex;}

/* ═══ PAGE 1: 岗位配置 ═══ */
.p1-layout{display:flex;flex:1;overflow:hidden;}
.p1-sidebar{width:280px;min-width:280px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.p1-sidebar .p1s-hdr{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
.p1-stats{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--border);}
.ps{flex:1;background:var(--bg-card);border-radius:var(--radius-sm);padding:6px 8px;text-align:center;}
.ps .n{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;}
.ps .l{font-size:9px;color:var(--text-muted);}
.ps.t .n{color:var(--accent-blue)}.ps.a .n{color:var(--accent-green)}.ps.p .n{color:var(--accent-yellow)}
.p1-search{padding:6px 12px;position:relative;}
.p1-search input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px 6px 26px;color:var(--text-primary);font-size:11px;font-family:'Noto Sans SC',sans-serif;outline:none;}
.p1-search input:focus{border-color:var(--border-active);}
.p1-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);}
.p1-tree{flex:1;overflow-y:auto;padding:3px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.p1-tree::-webkit-scrollbar{width:4px;}
.p1-tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.tc{margin:0 5px 1px;}
.tch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;font-weight:600;transition:var(--transition);}
.tch:hover{background:var(--bg-hover);}
.tch .tcl{display:flex;align-items:center;gap:4px;}
.tch .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tch .cnt{font-size:8px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;background:var(--bg-card);padding:1px 4px;border-radius:5px;}
.tch .chv{font-size:8px;color:var(--text-muted);transition:var(--transition);}
.tc.open .tch .chv{transform:rotate(90deg);}
.tsubs{display:none;}
.tc.open .tsubs{display:block;}
.ts{margin:0 0 1px 10px;}
.tsh{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:10px;color:var(--text-secondary);transition:var(--transition);}
.tsh:hover{background:var(--bg-hover);color:var(--text-primary);}
.tsh .sc{font-size:8px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.tis{display:none;}
.ts.open .tis{display:block;}
.ti{display:flex;align-items:center;justify-content:space-between;padding:3px 8px 3px 22px;font-size:10px;color:var(--text-muted);cursor:grab;border-radius:var(--radius-sm);transition:var(--transition);gap:3px;}
.ti:hover{background:var(--bg-hover);color:var(--text-secondary);}
.ti .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ti .tt{display:flex;gap:2px;flex-shrink:0;}
.ti .ttag{font-size:7px;padding:1px 3px;border-radius:3px;font-weight:600;}
.ti.used{opacity:.4;cursor:default;}

.p1-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.p1-main .p1m-hdr{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-panel);}
.p1-main .p1m-hdr .title{font-size:12px;font-weight:700;}
.p1-main .p1m-hdr .acts{display:flex;gap:5px;}

.btn{padding:5px 10px;border-radius:var(--radius-sm);border:none;font-size:10px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Noto Sans SC',sans-serif;}
.btn-pri{background:var(--accent-blue);color:#fff;}
.btn-pri:hover{background:#559ee0;}
.btn-sec{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);}
.btn-sec:hover{background:var(--bg-hover);color:var(--text-primary);}
.btn-gh{background:transparent;color:var(--text-muted);}
.btn-gh:hover{color:var(--text-primary);background:var(--bg-hover);}
.btn-ok{background:rgba(46,204,113,.1);color:var(--ok-color);border:1px solid var(--ok-color);font-size:9px;padding:4px 10px;}
.btn-ok:hover{background:var(--ok-color);color:#fff;}

.st-area{flex:1;overflow-x:auto;overflow-y:hidden;padding:10px;display:flex;gap:8px;align-items:flex-start;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.st-area::-webkit-scrollbar{height:4px;}
.st-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.pool{min-width:200px;max-width:200px;background:var(--bg-panel);border:1px dashed var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;max-height:calc(100vh - 95px);}
.pool .ph{padding:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pool .ph h3{font-size:11px;font-weight:700;color:var(--text-muted);}
.pool .ph .pc{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-yellow);font-weight:600;}
.pool .pi{flex:1;overflow-y:auto;padding:5px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.pool .pi::-webkit-scrollbar{width:3px;}
.pool .pi::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.st-col{min-width:240px;max-width:280px;background:var(--bg-panel);border-radius:var(--radius-lg);display:flex;flex-direction:column;max-height:calc(100vh - 95px);box-shadow:0 4px 12px rgba(0,0,0,.5);}
.st-col.s1{border-top:3px solid var(--accent-blue)}
.st-col.s2{border-top:3px solid var(--accent-green)}
.st-col.s3{border-top:3px solid var(--accent-orange)}
.st-col.s4{border-top:3px solid var(--accent-purple)}
.st-col.s5{border-top:3px solid var(--accent-cyan)}
.st-col .sh{padding:10px 12px;border-bottom:1px solid var(--border);}
.st-col .sh .sr{display:flex;align-items:center;justify-content:space-between;}
.st-col .sh h3{font-size:11px;font-weight:700;}
.st-col .sh .sa{display:flex;gap:2px;}
.st-col .sh .sa button{width:20px;height:20px;border-radius:4px;border:none;background:var(--bg-card);color:var(--text-muted);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.st-col .sh .sa button:hover{background:var(--bg-hover);color:var(--text-primary);}
.st-col .sh .sm{display:flex;gap:6px;margin-top:4px;font-size:9px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.st-col .sh .ss{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;}
.sktag{font-size:8px;padding:1px 5px;border-radius:7px;font-weight:600;}
.st-col .si{flex:1;overflow-y:auto;padding:5px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.st-col .si::-webkit-scrollbar{width:3px;}
.st-col .si::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;margin-bottom:3px;cursor:grab;transition:all var(--transition);}
.card:hover{border-color:var(--border-active);background:var(--bg-elevated);}
.card .cc{font-size:8px;font-weight:600;letter-spacing:.03em;margin-bottom:2px;}
.card .cn{font-size:10px;font-weight:500;margin-bottom:4px;line-height:1.3;}
.card .cf{display:flex;align-items:center;justify-content:space-between;font-size:8px;color:var(--text-muted);}
.card .cl{font-family:'JetBrains Mono',monospace;background:var(--bg-elevated);padding:1px 3px;border-radius:2px;}

.add-st{min-width:130px;height:fit-content;background:var(--bg-panel);border:1px dashed var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:var(--transition);}
.add-st:hover{border-color:var(--border-active);background:var(--bg-card);}
.add-st .ai{width:32px;height:32px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted);}
.add-st:hover .ai{border-color:var(--accent-blue);color:var(--accent-blue);}
.add-st span{font-size:10px;color:var(--text-muted);}

.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;color:var(--text-muted);font-size:10px;text-align:center;gap:2px;}
.emp .ei{font-size:20px;opacity:.3;}

/* ═══ PAGE 2: 检验记录 ═══ */
.p2-hdr{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg-panel);flex-wrap:wrap;}
.p2-hdr label{font-size:10px;font-weight:600;color:var(--text-muted);white-space:nowrap;}
.p2-hdr input,.p2-hdr select{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 7px;color:var(--text-primary);font-size:10px;font-family:'Noto Sans SC',sans-serif;outline:none;width:120px;}
.p2-hdr input:focus{border-color:var(--accent-blue);}
.p2-hdr .dv{width:1px;height:20px;background:var(--border);margin:0 2px;}
.p2-pills{display:flex;gap:5px;margin-left:auto;}
.rp{padding:3px 8px;border-radius:8px;font-size:9px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.rp.ok{background:rgba(46,204,113,.15);color:var(--ok-color);}
.rp.ng{background:rgba(231,76,60,.15);color:var(--ng-color);}
.rp.tt{background:var(--bg-card);color:var(--text-secondary);}

.p2-body{flex:1;display:flex;overflow:hidden;}
.p2-body .rec-st{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.p2-body .rec-st::-webkit-scrollbar{width:4px;}
.p2-body .rec-st::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.rsc{background:var(--bg-panel);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;}
.rsc .hdr{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);}
.rsc .hdr h3{font-size:11px;font-weight:700;}
.rsc .hdr .act{display:flex;gap:4px;align-items:center;}
.rsc .hdr .stt{font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);}
.rsc .body{padding:2px;}

.ir{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--radius-sm);transition:var(--transition);border-bottom:1px solid rgba(255,255,255,.02);}
.ir:hover{background:var(--bg-hover);}
.ir.ng{background:rgba(231,76,60,.06);}
.ir .info{flex:1;min-width:0;}
.ir .iname{font-size:10px;font-weight:500;}
.ir .imeta{font-size:8px;color:var(--text-muted);margin-top:1px;}
.ir .ngd{display:none;margin-left:6px;gap:2px;align-items:center;flex-wrap:wrap;}
.ir.ng .ngd{display:flex;}
.ir .ngd select{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;padding:2px 4px;font-size:9px;color:var(--text-primary);font-family:'Noto Sans SC',sans-serif;outline:none;}
.bt-up{padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:8px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;white-space:nowrap;transition:var(--transition);}
.bt-up:hover{border-color:var(--accent-blue);color:var(--accent-blue);}
.bt-up.has-p{border-color:var(--accent-green);color:var(--accent-green);}
.ir .pho{display:none;}
.ir.hp .pho{display:block;}
.ir .pho img{width:28px;height:28px;border-radius:3px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}

/* Toggle switch */
.tgl{position:relative;width:44px;height:24px;flex-shrink:0;}
.tgl input{display:none;}
.tgl .ts{position:absolute;inset:0;border-radius:12px;cursor:pointer;background:var(--bg-elevated);border:2px solid var(--border);transition:all var(--transition);display:flex;align-items:center;font-size:8px;font-weight:700;padding:0 4px;color:var(--text-muted);justify-content:flex-end;}
.tgl .ts::before{content:'';position:absolute;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-muted);transition:all var(--transition);}
.tgl input:checked+.ts{background:rgba(46,204,113,.15);border-color:var(--ok-color);justify-content:flex-start;color:var(--ok-color);}
.tgl input:checked+.ts::before{background:var(--ok-color);transform:translateX(18px);}
.tgl input.ngs+.ts{background:rgba(231,76,60,.15);border-color:var(--ng-color);color:var(--ng-color);}
.tgl input.ngs+.ts::before{background:var(--ng-color);}

/* NG panel */
.ng-pnl{width:290px;min-width:290px;background:var(--bg-panel);border-left:1px solid var(--border);display:flex;flex-direction:column;}
.ng-pnl .hdr{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(231,76,60,.06);}
.ng-pnl .hdr h3{font-size:11px;font-weight:700;color:var(--ng-color);}
.ng-pnl .hdr .cnt{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--ng-color);}
.ng-pnl .list{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.ng-pnl .list::-webkit-scrollbar{width:3px;}
.ng-pnl .list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.ngc{background:var(--bg-card);border:1px solid rgba(231,76,60,.2);border-radius:var(--radius-sm);padding:7px;margin-bottom:4px;}
.ngc .h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;}
.ngc .h .nm{font-size:10px;font-weight:600;color:var(--ng-color);}
.ngc .h .st{font-size:7px;background:var(--bg-elevated);padding:1px 4px;border-radius:3px;color:var(--text-muted);white-space:nowrap;}
.ngc .r{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin-top:2px;}
.ngc .tp{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600;background:rgba(231,76,60,.15);color:var(--ng-color);}
.ngc .st2{font-size:8px;padding:1px 5px;border-radius:3px;}
.ngc .st2.pd{background:rgba(229,168,62,.15);color:var(--accent-yellow);}
.ngc .st2.fx{background:rgba(74,144,217,.15);color:var(--accent-blue);}
.ngc .st2.fd{background:rgba(76,175,125,.15);color:var(--accent-green);}
.ngc .ps{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px;}
.ngc .ps img{width:40px;height:40px;border-radius:3px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.ngc .ac{margin-top:3px;}

/* ═══ PAGE 3: NG分析 ═══ */
.p3-hdr{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg-panel);}
.p3-hdr h2{font-size:13px;font-weight:700;}
.p3-body{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.p3-body::-webkit-scrollbar{width:4px;}
.p3-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.ac{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;min-height:220px;}
.ac.wide{grid-column:1/-1;}
.ac h4{font-size:10px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.ac .ca{display:flex;align-items:flex-end;gap:5px;height:160px;padding:0 2px;}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.cbar{width:100%;max-width:50px;border-radius:4px 4px 0 0;transition:height .4s cubic-bezier(.4,0,.2,1);position:relative;cursor:pointer;min-height:3px;}
.cbar:hover{filter:brightness(1.3);}
.cbar .cv{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.cbl{font-size:8px;color:var(--text-muted);margin-top:5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.dc{display:flex;align-items:center;justify-content:center;height:160px;}
.dc svg{width:140px;height:140px;}
.dl{display:flex;flex-direction:column;gap:3px;margin-left:14px;}
.di{display:flex;align-items:center;gap:4px;font-size:9px;}
.dd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dv{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.sc{background:var(--bg-card);border-radius:var(--radius-sm);padding:10px;text-align:center;border:1px solid var(--border);}
.sc .v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.sc .l{font-size:9px;color:var(--text-muted);margin-top:2px;}
.nd{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:11px;}

.c1{background:var(--accent-blue)}.c2{background:var(--accent-green)}.c3{background:var(--accent-orange)}.c4{background:var(--accent-purple)}.c5{background:var(--accent-cyan)}.c6{background:var(--accent-yellow)}.c7{background:var(--accent-red)}.c8{background:#d96b9e}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);}
.mo.off{display:none;}
.mo .mw{background:var(--bg-elevated);border-radius:var(--radius-lg);padding:16px;width:360px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--border);}
.mo .mw h2{font-size:13px;font-weight:700;margin-bottom:10px;}
.mo .mw label{display:block;font-size:9px;font-weight:600;margin-bottom:2px;color:var(--text-secondary);}
.mo .mw input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 8px;color:var(--text-primary);font-size:10px;font-family:'Noto Sans SC',sans-serif;outline:none;margin-bottom:8px;}
.mo .mw input:focus{border-color:var(--accent-blue);}
.mo .mw .skb{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;}
.mo .mw .sk{padding:4px 8px;border-radius:12px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);transition:var(--transition);}
.mo .mw .sk:hover{border-color:var(--border-active);}
.mo .mw .sk.on{border-color:currentColor;}
.mo .mw .ma{display:flex;gap:4px;justify-content:flex-end;}

/* Toast */
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 14px;font-size:10px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;}
.toast.show{opacity:1;}

/* Photo viewer */
.pv{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:300;cursor:pointer;}
.pv.off{display:none;}
.pv img{max-width:90vw;max-height:90vh;border-radius:8px;}

@media(max-width:1000px){.p3-body{grid-template-columns:1fr;}}

/* ── Mobile responsive ── */
@media(max-width:768px){
  body{flex-direction:column;}
  #nav{width:100%;min-width:100%;flex-direction:row;flex-wrap:wrap;height:auto;padding:4px 8px;}
  #nav .nb{padding:6px 8px;border-bottom:none;border-right:1px solid var(--border);}
  #nav .nb .logo{width:24px;height:24px;font-size:11px;border-radius:5px;}
  #nav .nb .bt{font-size:11px;}
  #nav .ni{flex-direction:row;padding:0;gap:2px;flex:1;overflow-x:auto;}
  .nav-btn{padding:8px 10px;font-size:10px;gap:4px;white-space:nowrap;border-radius:var(--radius-sm);}
  .nav-btn .ni-icon{font-size:16px;}
  #nav .nf{padding:4px 6px;border-top:none;border-left:1px solid var(--border);}
  #nav .nf select{font-size:9px;padding:4px;}
  .p1-layout{flex-direction:column;}
  .p1-sidebar{width:100%;min-width:100%;max-height:40vh;flex-shrink:0;}
  .st-area{flex-direction:column;overflow-y:auto;overflow-x:hidden;align-items:stretch;}
  .pool{min-width:100%;max-width:100%;max-height:200px;}
  .st-col{min-width:100%;max-width:100%;max-height:300px;}
  .add-st{min-width:100%;}
  .p2-body{flex-direction:column;}
  .ng-pnl{width:100%;min-width:100%;max-height:35vh;}
  .p2-hdr{flex-wrap:wrap;gap:4px;}
  .p2-hdr input,.p2-hdr select{width:90px;font-size:9px;}
  .p3-body{grid-template-columns:1fr;padding:6px;}
}

// Auto-scroll during drag
var scrollTimer=null;
function startAutoScroll(){document.addEventListener('dragover',updateAutoScroll,true);}
function stopAutoScroll(){if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}document.removeEventListener('dragover',updateAutoScroll,true);}
function updateAutoScroll(e){
  if(!dragId)return;
  var area=document.getElementById('stationArea');
  if(!area)return;
  var rect=area.getBoundingClientRect();
  var x=e.clientX,y=e.clientY;
  var margin=80;
  var speed=15;
  if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}
  if(x<rect.left+margin){scrollTimer=setInterval(function(){area.scrollLeft-=speed;},30);}
  else if(x>rect.right-margin){scrollTimer=setInterval(function(){area.scrollLeft+=speed;},30);}
  else if(y<rect.top+margin){scrollTimer=setInterval(function(){area.scrollTop-=speed;},30);}
  else if(y>rect.bottom-margin){scrollTimer=setInterval(function(){area.scrollTop+=speed;},30);}
}

  var configs={};

function importAllData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);
    // Handle mobile export format
    if(d.records&&!d.allRecs){
      d.allRecs=d.records.map(function(rec){
        var sr={};sr[rec.stationId]={};
        Object.keys(rec.results||{}).forEach(function(iid){
          sr[rec.stationId][iid]={r:rec.results[iid].r,dt:rec.results[iid].dt||'',ds:rec.results[iid].ds||'待确认',ps:rec.results[iid].ps||[]};
        });
        return {vin:rec.vin,insp:'',batch:'',date:rec.ts?rec.ts.slice(0,10):'',sr:sr,ts:rec.ts};
      });
    }
    if(d.stations)stations=d.stations;
    if(d.allRecs)allRecs=d.allRecs;
    saveToStorage();refreshAll();showToast('✅ 已导入('+allRecs.length+'条记录)');
    document.getElementById('syncStatus').textContent='💾 本地存储 ('+allRecs.length+'条记录)';
  }catch(ex){showToast('⚠️ 文件格式错误');}};r.readAsText(f);};
  inp.click();
}

}

// ═══════════ CLOUD SYNC ═══════════
function prepareCloudSync(){
  var records=[];
  allRecs.forEach(function(rec){
    if(!rec.sr)return;
    Object.keys(rec.sr).forEach(function(sid){
      var st=stations.find(function(s){return s.id===sid;});
      Object.keys(rec.sr[sid]).forEach(function(iid){
        var r=rec.sr[sid][iid];
        if(r.r==='ok'||r.r==='ng'){
          var it=gItem(iid);
          records.push({
            车架号:rec.vin,
            检验员:rec.insp,
            批次:rec.batch,
            检验日期:rec.date,
            岗位:st?st.name:sid,
            检验项:it?it.n:iid,
            检验大类:it?it.cn:'',
            检验结果:r.r==='ok'?'OK':'NG',
            缺陷类型:r.r==='ng'?r.dt||'':'',
            处理状态:r.r==='ng'?r.ds||'待确认':'',
            照片链接:r.ps&&r.ps.length>0?r.ps[0]:'',
            提交时间:rec.ts?rec.ts.slice(0,10):''
          });
        }
      });
    });
  });
  return records;
}
function showCloudPanel(){
  var recs=prepareCloudSync();
  var ngRecs=recs.filter(function(r){return r.检验结果==='NG';});
  var msg='☁️ 云端同步数据\n\n';
  msg+='检验记录: '+recs.length+' 条\n';
  msg+='NG记录: '+ngRecs.length+' 条\n';
  msg+='\n智能表格地址:\n'+SHEET_URL;
  if(recs.length===0){msg+='\n\n暂无数据需要同步';}
  else{msg+='\n\n数据已保存在本地，可通过导出功能备份';}
  alert(msg);
}

function initRec(){var n=new Date();document.getElementById('dateInput').value=n.toLocaleDateString('zh-CN');document.getElementById('batchInput').value='BATCH-'+n.toISOString().slice(0,10).replace(/-/g,'');if(!curRec.sr||Object.keys(curRec.sr).length===0){curRec.sr={};stations.forEach(st=>{curRec.sr[st.id]={};st.items.forEach(iid=>{curRec.sr[st.id][iid]={r:null,dt:'',ds:'待确认',ps:[]};});});}renderRec();updNG();}
function renderRec(){var c=document.getElementById('recordStations'),h='';stations.forEach(st=>{var si=st.items.map(id=>gItem(id)).filter(Boolean);if(si.length===0)return;var ok=si.filter(it=>curRec.sr[st.id]?.[it.id]?.r==='ok').length,ng=si.filter(it=>curRec.sr[st.id]?.[it.id]?.r==='ng').length;h+='<div class="rsc"><div class="hdr"><h3>'+st.name+'</h3><div class="act"><span class="stt">OK:'+ok+' NG:'+ng+'</span><button class="btn btn-ok" onclick="batchOK(\''+st.id+'\')">✓ 一键OK</button></div></div><div class="body">';si.forEach(it=>{var r=curRec.sr[st.id]?.[it.id]||{r:null,dt:'',ds:'待确认',ps:[]},isNG=r.r==='ng',isOK=r.r==='ok',hp=r.ps&&r.ps.length>0,cc=CCOLS[it.cn]||'#999';h+='<div class="ir'+(isNG?' ng':'')+(hp?' hp':'')+'"><div class="info"><div class="iname">'+it.n+'</div><div class="imeta"><span style="color:'+cc+'">'+it.cn+'</span> · 📍'+it.loc+'</div></div><div class="ngd"><select onchange="uNT(\''+st.id+'\',\''+it.id+'\',this.value)"><option value="">缺陷类型</option>'+DEFECTS.map(d=>'<option value="'+d+'"'+(r.dt===d?' selected':'')+'>'+d+'</option>').join('')+'</select><select style="padding:2px 4px;font-size:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);border-radius:3px;font-family:Noto Sans SC,sans-serif;outline:none" onchange="uNS(\''+st.id+'\',\''+it.id+'\',this.value)">'+NGSTAT.map(s=>'<option value="'+s+'"'+(r.ds===s?' selected':'')+'>'+s+'</option>').join('')+'</select><button class="bt-up'+(hp?' has-p':'')+'" onclick="up(\''+st.id+'\',\''+it.id+'\')">📷'+(hp?' ('+r.ps.length+')':'拍照')+'</button></div><div class="pho">'+(r.ps||[]).map((p,i)=>'<img src="'+p+'" onclick="vp(\''+p+'\')" title="照片'+(i+1)+'">').join('')+'</div><label class="tgl"><input type="checkbox" class="'+(isNG?'ngs':'')+'" '+(isOK?'checked':'')+' onchange="tIR(\''+st.id+'\',\''+it.id+'\',this)"><span class="ts">'+(isOK?'OK':isNG?'NG':'')+'</span></label></div>';});h+='</div></div>';});if(!h)h='<div class="emp"><div class="ei">📋</div><span>请先在「岗位配置」中分配检验项</span></div>';c.innerHTML=h;updRecStats();}
function tIR(sid,iid,cb){var r=curRec.sr[sid][iid];if(cb.checked){r.r='ok';r.dt='';cb.classList.remove('ngs');}else{r.r='ng';if(!r.dt)r.dt=DEFECTS[0];cb.classList.add('ngs');}renderRec();updNG();}
function uNT(sid,iid,v){if(curRec.sr[sid]?.[iid])curRec.sr[sid][iid].dt=v;updNG();}
function uNS(sid,iid,v){if(curRec.sr[sid]?.[iid])curRec.sr[sid][iid].ds=v;updNG();}
function batchOK(sid){var st=stations.find(s=>s.id===sid);if(!st)return;st.items.forEach(iid=>{if(curRec.sr[sid]?.[iid]){curRec.sr[sid][iid].r='ok';curRec.sr[sid][iid].dt='';}});renderRec();updNG();showToast('✅ 全部OK');}
function up(sid,iid){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){if(!curRec.sr[sid])curRec.sr[sid]={};if(!curRec.sr[sid][iid])curRec.sr[sid][iid]={r:'ng',dt:'',ds:'待确认',ps:[]};curRec.sr[sid][iid].ps.push(ev.target.result);if(curRec.sr[sid][iid].r!=='ng'){curRec.sr[sid][iid].r='ng';if(!curRec.sr[sid][iid].dt)curRec.sr[sid][iid].dt=DEFECTS[0];}renderRec();updNG();showToast('📷 已上传');};r.readAsDataURL(f);};inp.click();}
function vp(src){document.getElementById('photoViewer').classList.remove('off');document.getElementById('pvImg').src=src;}
function closePV(){document.getElementById('photoViewer').classList.add('off');}
function updRecStats(){var t=0,ok=0,ng=0;stations.forEach(st=>{st.items.forEach(iid=>{t++;var r=curRec.sr[st.id]?.[iid];if(r?.r==='ok')ok++;else if(r?.r==='ng')ng++;});});document.getElementById('recTotal').textContent='共 '+t+' 项';document.getElementById('recOK').textContent='OK: '+ok;document.getElementById('recNG').textContent='NG: '+ng;}
function updNG(){var ni=[];stations.forEach(st=>{st.items.forEach(iid=>{var r=curRec.sr[st.id]?.[iid];if(r?.r==='ng'){var it=gItem(iid);ni.push({sid:st.id,sn:st.name,iid:iid,in:it?.n||iid,dt:r.dt||'未分类',ds:r.ds||'待确认',ps:r.ps||[]});}});});document.getElementById('ngTotalCount').textContent=ni.length;var b=document.getElementById('navBadge');if(ni.length>0){b.style.display='block';b.textContent=ni.length;}else{b.style.display='none';}var l=document.getElementById('ngSidebarList');if(ni.length===0){l.innerHTML='<div class="emp"><div class="ei">✅</div>暂无NG项</div>';}else{l.innerHTML=ni.map(ng=>{var si=NGSTAT.indexOf(ng.ds),sc=si<=1?'pd':si<=2?'fx':'fd',ph=(ng.ps||[]).map((p,i)=>'<img src="'+p+'" onclick="vp(\''+p+'\')">').join('');return'<div class="ngc"><div class="h"><span class="nm">⚠ '+ng.in+'</span><span class="st">'+ng.sn+'</span></div><div class="r"><span class="tp">'+ng.dt+'</span><span class="st2 '+sc+'">'+ng.ds+'</span></div>'+(ph?'<div class="ps">'+ph+'</div>':'')+'<div class="ac"><button class="bt-up has-p" onclick="up(\''+ng.sid+'\',\''+ng.iid+'\')">📷 添加照片</button></div></div>';}).join('');}}
function submitRecord(){var vin=document.getElementById('vinInput').value.trim();if(!vin){showToast('⚠️ 请输入车架号');return;}curRec.vin=vin;curRec.insp=document.getElementById('inspectorInput').value.trim();curRec.batch=document.getElementById('batchInput').value;curRec.date=document.getElementById('dateInput').value;curRec.ts=new Date().toISOString();allRecs.push(JSON.parse(JSON.stringify(curRec)));curRec={vin:'',insp:'',batch:'',date:'',sr:{}};stations.forEach(st=>{curRec.sr[st.id]={};st.items.forEach(iid=>{curRec.sr[st.id][iid]={r:null,dt:'',ds:'待确认',ps:[]};});});document.getElementById('vinInput').value='';document.getElementById('inspectorInput').value='';saveToStorage();initRec();showToast('✅ 已提交，已清空');updAF();}
function onVin(){curRec.vin=document.getElementById('vinInput').value.trim();}
function onIns(){curRec.insp=document.getElementById('inspectorInput').value.trim();}

// ═══════════ PAGE 3 ═══════════
function renderAnalysis(){
  var fv=document.getElementById('analysisFilter')?.value||'all',recs=allRecs;
  if(fv!=='all')recs=allRecs.filter(r=>r.batch===fv||r.vin===fv);
  // Collect NG items with photos
  var ngs=[];
  // Group by VIN + date
  var vinGroups={};
  recs.forEach(function(rec){
    if(!rec.sr)return;
    var key=rec.vin;
    if(!vinGroups[key])vinGroups[key]={vin:rec.vin,date:rec.date||'',ts:rec.ts||'',insp:rec.insp||'',ngItems:[],okCount:0,ngCount:0,allStations:[]};
    if(!vinGroups[key].allStations.includes(rec.stationName||''))vinGroups[key].allStations.push(rec.stationName||'');
    Object.keys(rec.sr).forEach(function(sid){
      var st=stations.find(function(s){return s.id===sid;});
      var stName=st?.name||sid;
      if(!vinGroups[key].allStations.includes(stName))vinGroups[key].allStations.push(stName);
      Object.keys(rec.sr[sid]).forEach(function(iid){
        var r=rec.sr[sid][iid];var it=gItem(iid);
        if(r?.r==='ng'){
          var ngItem={vin:rec.vin,sn:stName,iname:it?.n||iid,cn:it?.cn||'',dt:r.dt||'未分类',ds:r.ds||'待确认',ps:r.ps||[],iid:iid,sid:sid};
          ngs.push(ngItem);
          vinGroups[key].ngItems.push(ngItem);
          vinGroups[key].ngCount++;
        }else if(r?.r==='ok'){
          vinGroups[key].okCount++;
        }
      });
    });
  });
  var b=document.getElementById('analysisBody');
  if(ngs.length===0&&Object.keys(vinGroups).length===0){
    b.innerHTML='<div class="ac wide" style="grid-column:1/-1;display:flex;align-items:center;justify-content:center"><div class="nd">📊 暂无数据，请先点「📡从服务器加载」</div></div>';
    return;
  }
  var res=ngs.filter(function(n){return n.ds==='已返修'||n.ds==='复检OK';}).length;
  var h='<div class="ac wide"><h4>📈 NG总览</h4><div class="sg">';
  h+='<div class="sc"><div class="v" style="color:var(--ng-color)">'+ngs.length+'</div><div class="l">NG总数</div></div>';
  h+='<div class="sc"><div class="v" style="color:var(--accent-blue)">'+Object.keys(vinGroups).length+'</div><div class="l">检验台数</div></div>';
  h+='<div class="sc"><div class="v" style="color:var(--accent-yellow)">'+(ngs.length/Math.max(Object.keys(vinGroups).length,1)).toFixed(1)+'</div><div class="l">均台NG</div></div>';
  h+='<div class="sc"><div class="v" style="color:var(--accent-green)">'+res+'</div><div class="l">已解决</div></div></div></div>';

  // Record list grouped by VIN (scrollable)
  var searchVal=(document.getElementById('vinSearch')?.value||'').toLowerCase().trim();
  h+='<div class="ac wide"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px"><h4 style="margin:0">📋 检验记录（按车架号）</h4><div style="display:flex;gap:6px"><input type="text" id="vinSearch" placeholder="搜索车架号..." oninput="renderAnalysis()" style="background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text-primary);font-size:11px;outline:none;width:140px"><button class="btn btn-sec" onclick="exportRecords()" style="font-size:10px">📥 导出NG报告</button></div></div>';
  h+='<div style="max-height:400px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent">';
  var groups=Object.values(vinGroups).sort(function(a,b){return(b.ts||'').localeCompare(a.ts||'');});
  if(searchVal){groups=groups.filter(function(g){return g.vin.toLowerCase().includes(searchVal);});}
  groups.forEach(function(g,i){
    var stList=g.allStations.join('、');
    h+='<div class="rec-card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;transition:all .2s">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">';
    h+='<div><span style="font-weight:700;font-size:14px">🚲 '+g.vin+'</span> <span style="color:var(--text-muted);font-size:11px;margin-left:8px">'+g.date+'</span>'+(g.insp?'<span style="color:var(--accent-blue);font-size:11px;margin-left:8px">👤 '+g.insp+'</span>':'')+'</div>';
    h+='<div style="display:flex;gap:8px;align-items:center"><span style="color:var(--ng-color);font-size:12px;font-weight:700">NG:'+g.ngCount+'</span><button onclick="event.stopPropagation();printVehicleReport(\''+g.vin+'\')" style="font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer">🖨</button><span style="color:var(--text-muted);cursor:pointer" onclick="toggleRec('+i+')">▶</span></div>';
    h+='</div>';
    h+='<div style="font-size:10px;color:var(--text-muted);margin-top:4px">岗位：'+stList+'</div>';
    h+='<div class="rec-detail" id="rec-'+i+'" style="display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:8px">';
    g.ngItems.forEach(function(ng){
      h+='<div style="margin-bottom:8px;padding:6px;background:rgba(231,76,60,.05);border-radius:6px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      h+='<div><div style="font-weight:600;color:var(--ng-color);font-size:12px">⚠ '+ng.iname+'</div>';
      h+='<div style="font-size:10px;color:var(--text-muted);margin-top:2px">'+ng.sn+' · '+ng.cn+'</div></div>';
      h+='<div style="display:flex;gap:4px"><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(231,76,60,.15);color:var(--ng-color)">'+ng.dt+'</span><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(229,168,62,.15);color:var(--accent-yellow)">'+ng.ds+'</span></div>';
      h+='</div>';
      if(ng.ps&&ng.ps.length>0){
        h+='<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
        ng.ps.forEach(function(p){h+='<img src="'+p+'" onclick="vp(\''+p+'\')" style="width:60px;height:60px;border-radius:4px;object-fit:cover;border:1px solid var(--border);cursor:pointer">';});
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div></div>';
  });
  if(groups.length===0){h+='<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px">未找到匹配的车架号</div>';}
  h+='</div></div>';

  // Charts
  var bs={};ngs.forEach(function(n){bs[n.sn]=(bs[n.sn]||0)+1;});
  h+=barC('按岗位分布',bs,['c1','c2','c3','c4','c5']);
  var bt={};ngs.forEach(function(n){bt[n.dt]=(bt[n.dt]||0)+1;});
  h+=barC('按缺陷类型（帕累托）',bt,['c1','c2','c3','c4','c5','c6','c7','c8']);
  var bc={};ngs.forEach(function(n){bc[n.cn]=(bc[n.cn]||0)+1;});
  h+=donutC('按检验大类',bc);

  b.innerHTML=h;
}
function toggleRec(i){var el=document.getElementById('rec-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function vp(src){document.getElementById('photoViewer').classList.remove('off');document.getElementById('pvImg').src=src;}
function exportRecords(){
  var rows=[];var ngCount=0;
  allRecs.forEach(function(rec){
    if(!rec.sr)return;
    Object.keys(rec.sr).forEach(function(sid){
      var st=stations.find(function(s){return s.id===sid;});
      Object.keys(rec.sr[sid]).forEach(function(iid){
        var r=rec.sr[sid][iid];var it=gItem(iid);
        if(r?.r==='ng'){
          var photos='';
          if(r.ps&&r.ps.length>0){r.ps.forEach(function(p){photos+='<img src="'+p+'" style="width:120px;height:90px;object-fit:cover;border-radius:4px;margin:2px">';});}
          rows.push({vin:rec.vin||'',date:rec.date||'',insp:rec.insp||'',station:st?.name||'',item:it?.n||iid,category:it?.cn||'',defect:r.dt||'',status:r.ds||'',photos:photos});
          ngCount++;
        }
      });
    });
  });
  if(rows.length===0){showToast('⚠️ 暂无NG数据');return;}
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>NG缺陷报告</title><style>';
  html+='body{font-family:Microsoft YaHei,sans-serif;margin:20px;background:#fff;color:#333}';
  html+='h1{text-align:center;margin-bottom:5px} .info{text-align:center;color:#888;margin-bottom:20px;font-size:13px}';
  html+='table{width:100%;border-collapse:collapse;font-size:12px}';
  html+='th{background:#c0392b;color:#fff;padding:8px;text-align:center}';
  html+='td{border:1px solid #ddd;padding:6px;text-align:center;vertical-align:top}';
  html+='tr:nth-child(even){background:#f9f9f9} .defect{background:#fff3cd;padding:2px 6px;border-radius:3px;font-size:11px}';
  html+='@media print{body{margin:0}table{font-size:10px}}';
  html+='</style></head><body>';
  html+='<h1>NG缺陷报告</h1>';
  html+='<div class="info">导出时间：'+new Date().toLocaleString('zh-CN')+' ｜ NG总数：'+ngCount+'</div>';
  html+='<table><thead><tr><th>车架号</th><th>日期</th><th>检验员</th><th>岗位</th><th>NG检验项</th><th>检验大类</th><th>缺陷类型</th><th>处理状态</th><th>照片</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr>';
    html+='<td>'+r.vin+'</td><td>'+r.date+'</td><td>'+r.insp+'</td><td>'+r.station+'</td>';
    html+='<td>'+r.item+'</td><td>'+r.category+'</td>';
    html+='<td><span class="defect">'+r.defect+'</span></td><td>'+r.status+'</td>';
    html+='<td style="max-width:280px">'+(r.photos||'—')+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table></body></html>';
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NG缺陷报告_'+new Date().toISOString().slice(0,10)+'.html';a.click();
  showToast('📥 NG报告已导出（含照片）');
}
function printVehicleReport(vin){
  var ngItems=[];var ngCount=0;var okCount=0;var dateStr='';var inspStr='';var stList=[];
  allRecs.forEach(function(rec){
    if(rec.vin!==vin)return;
    dateStr=rec.date||'';
    inspStr=rec.insp||'';
    if(!rec.sr)return;
    Object.keys(rec.sr).forEach(function(sid){
      var st=stations.find(function(s){return s.id===sid;});
      var stName=st?.name||sid;
      if(!stList.includes(stName))stList.push(stName);
      Object.keys(rec.sr[sid]).forEach(function(iid){
        var r=rec.sr[sid][iid];var it=gItem(iid);
        if(r?.r==='ng'){
          var photos='';
          if(r.ps&&r.ps.length>0){r.ps.forEach(function(p){photos+='<img src="'+p+'" style="width:100px;height:75px;object-fit:cover;border-radius:4px;margin:2px">';});}
          ngItems.push({item:it?.n||iid,station:stName,category:it?.cn||'',defect:r.dt||'',status:r.ds||'',photos:photos});
          ngCount++;
        }else if(r?.r==='ok'){okCount++;}
      });
    });
  });
  if(ngItems.length===0){showToast('⚠️ 该车架号暂无NG记录');return;}
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>NG报告-'+vin+'</title><style>';
  html+='body{font-family:Microsoft YaHei,sans-serif;margin:20px;color:#333}h1{text-align:center;margin-bottom:5px}';
  html+='.info{text-align:center;color:#666;margin-bottom:15px;font-size:13px;border-bottom:2px solid #c0392b;padding-bottom:8px}';
  html+='table{width:100%;border-collapse:collapse;font-size:11px}th{background:#c0392b;color:#fff;padding:6px;text-align:center}td{border:1px solid #ccc;padding:4px;text-align:center;vertical-align:top}tr:nth-child(even){background:#f5f5f5}';
  html+='.summary{display:flex;justify-content:center;gap:30px;margin:10px 0;font-size:14px}.defect{background:#fff3cd;padding:1px 4px;border-radius:3px}';
  html+='@media print{body{margin:5px}table{font-size:9px}img{width:60px!important;height:45px!important}}</style></head><body>';
  html+='<h1>NG缺陷报告</h1>';
  html+='<div class="info">车架号：<b>'+vin+'</b> ｜ 日期：'+dateStr+' ｜ 检验员：'+inspStr+' ｜ 岗位：'+stList.join('、')+'</div>';
  html+='<div class="summary"><span>总项数：<b>'+(ngCount+okCount)+'</b></span><span style="color:#2ecc71">OK：'+okCount+'</span><span style="color:#e74c3c;font-weight:700">NG：'+ngCount+'</span></div>';
  html+='<table><thead><tr><th>NG检验项</th><th>岗位</th><th>检验大类</th><th>缺陷类型</th><th>处理状态</th><th>照片</th></tr></thead><tbody>';
  ngItems.forEach(function(it){
    html+='<tr><td>'+it.item+'</td><td>'+it.station+'</td><td>'+it.category+'</td><td><span class="defect">'+it.defect+'</span></td><td>'+it.status+'</td><td>'+(it.photos||'—')+'</td></tr>';
  });
  html+='</tbody></table></body></html>';
  var w=window.open('','_blank');
  w.document.write(html);w.document.close();
  setTimeout(function(){w.print();},500);
}
function barC(title,data,cs){var e=Object.entries(data).sort((a,b)=>b[1]-a[1]),mx=Math.max(...e.map(x=>x[1]),1),bars=e.map((x,i)=>{var h2=Math.max((x[1]/mx)*140,3);return'<div class="cb"><span class="cv">'+x[1]+'</span><div class="cbar '+cs[i%cs.length]+'" style="height:'+h2+'px"></div><div class="cbl">'+x[0]+'</div></div>';}).join('');return'<div class="ac"><h4>'+title+'</h4><div class="ca">'+bars+'</div></div>';}
function donutC(title,data){var e=Object.entries(data).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0),pal=['#4a90d9','#e07b40','#4caf7d','#8b6fc0','#3db8b0','#e5a83e','#d9485e','#d96b9e'],cx=70,cy=70,r=55,sw=24,cum=0,sl='',lg='';e.forEach((x,i)=>{var p=x[1]/t,sa=(cum/t)*2*Math.PI-Math.PI/2;cum+=x[1];var ea=(cum/t)*2*Math.PI-Math.PI/2,x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa),x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea),la=p>.5?1:0;sl+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+la+',1 '+x2+','+y2+' Z" fill="'+pal[i%pal.length]+'"/>';lg+='<div class="di"><span class="dd" style="background:'+pal[i%pal.length]+'"></span><span>'+x[0]+'</span><span class="dv">'+x[1]+' ('+(p*100).toFixed(0)+'%)</span></div>';});return'<div class="ac"><h4>'+title+'</h4><div class="dc"><svg viewBox="0 0 140 140">'+sl+'<circle cx="70" cy="70" r="43" fill="var(--bg-deep)"/><text x="70" y="66" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700" fill="var(--text-primary)">'+t+'</text><text x="70" y="82" text-anchor="middle" font-size="8" fill="var(--text-muted)">NG总数</text></svg><div class="dl">'+lg+'</div></div></div>';}
function updAF(){var s=document.getElementById('analysisFilter');if(!s)return;s.innerHTML='<option value="all">全部批次</option>';var bs=[...new Set(allRecs.map(r=>r.batch).filter(Boolean))];bs.forEach(b=>{s.innerHTML+='<option value="'+b+'">'+b+'</option>';});}
function clearAllRecords(){if(!confirm('确定清空所有记录？'))return;allRecs=[];updAF();renderAnalysis();showToast('🗑️ 已清空');}

// ═══════════ UTILITY ═══════════
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}
function onVeh(){var s=document.getElementById('vs');if(s.value==='new'){var n=prompt('请输入新车型名称：');if(n){var o=document.createElement('option');o.textContent=n;o.value=n.toLowerCase();o.selected=true;showToast('✅ 已切换：'+n);}else{s.value='commuter';return;}}}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// Init: load saved data or use defaults
if(!loadFromStorage()){
  saveToStorage();
}
refreshAll();
updateVehicleDropdown();
syncConfigsFromServer();  // Pull configs from server on load
document.getElementById('syncStatus').textContent='💾 本地存储 ('+allRecs.length+'条记录)';
// Auto-refresh from server every 15 seconds
autoRefresh();
</script>
